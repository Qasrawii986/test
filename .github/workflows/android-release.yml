name: Build & release SMS Expense APK

# Publishes a signed APK to GitHub Releases so the in-app updater can find it.
# The release assets keep fixed names, which makes these URLs always valid:
#   https://github.com/<owner>/<repo>/releases/latest/download/update.json
#   https://github.com/<owner>/<repo>/releases/latest/download/app-release.apk

on:
  push:
    branches:
      - claude/android-sms-expense-tracker-8x6qps
    paths:
      - 'SmsExpenseTracker/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

defaults:
  run:
    working-directory: SmsExpenseTracker

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Decrypt signing keystore
        env:
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          if [ -z "$KEYSTORE_PASSPHRASE" ]; then
            echo "::error::KEYSTORE_PASSPHRASE secret is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          gpg --batch --yes --decrypt --passphrase "$KEYSTORE_PASSPHRASE" \
            --output signing/release.jks signing/release.jks.gpg
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=smsexpense\nstoreFile=signing/release.jks\n' \
            "$KEYSTORE_PASSPHRASE" "$KEYSTORE_PASSPHRASE" > signing/keystore.properties

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Read version info
        id: version
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts | head -1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp "${{ steps.version.outputs.apk }}" release-assets/app-release.apk
          NOTES=$(git log -1 --pretty=%s)
          cat > release-assets/update.json <<EOF
          {
            "versionCode": ${{ steps.version.outputs.code }},
            "versionName": "${{ steps.version.outputs.name }}",
            "notes": $(printf '%s' "$NOTES" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))'),
            "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk"
          }
          EOF
          cat release-assets/update.json

      - name: Delete existing release for this version (idempotent re-runs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "SMS Expense $TAG (build ${{ steps.version.outputs.code }})" \
            --notes "$(git log -1 --pretty=%B)" \
            --latest \
            release-assets/app-release.apk \
            release-assets/update.json

      - name: Clean up decrypted secrets
        if: always()
        run: rm -f signing/release.jks signing/keystore.properties
